<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><title id="title">JOHN ONLINE SERVICES</title><desc id="desc">Decorative animated project banner. The text remains readable when motion is disabled.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0A1428"/><stop offset="1" stop-color="#132D47"/></linearGradient><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F2B84B" stroke-opacity=".08"/></pattern></defs><rect width="1000" height="240" rx="22" fill="url(#g)"/><rect width="1000" height="240" rx="22" fill="url(#p)"/><g fill="none" stroke="#F2B84B" stroke-width="2"><circle cx="870" cy="120" r="65" opacity=".3"><animate attributeName="r" values="55;77;55" dur="6s" repeatCount="indefinite"/></circle><circle cx="870" cy="120" r="91" opacity=".15"/><path d="M700 195Q825 40 995 102" stroke-dasharray="9 12" opacity=".55"><animate attributeName="stroke-dashoffset" values="0;-84" dur="5s" repeatCount="indefinite"/></path></g><circle cx="870" cy="120" r="28" fill="#F2B84B" opacity=".85"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle><text x="55" y="112" font-family="Arial,sans-serif" font-weight="700" font-size="43" fill="#FFFFFF">JOHN ONLINE SERVICES</text><text x="57" y="155" font-family="Arial,sans-serif" font-size="22" fill="#F2B84B">Digital Solutions · Simplified</text><text x="57" y="202" font-family="Arial,sans-serif" font-size="14" fill="#D8E2EF">Built by John Charles Sarwi · Tanzania</text><style>@media (prefers-reduced-motion:reduce){animate{display:none}}</style></svg>